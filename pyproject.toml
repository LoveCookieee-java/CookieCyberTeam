[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "blue-team-security-guardrails"
version = "1.2.0"
description = "Blue Team MCP Security Guardrails & Multi-Agent Orchestration Server"
readme = "README.md"
requires-python = ">=3.9"
authors = [
    { name = "CookieGli Security Team" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Security",
]

[project.scripts]
blue-team-mcp = "server:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
