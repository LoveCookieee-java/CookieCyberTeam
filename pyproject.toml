[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cookie-cyber-team"
version = "1.0.1"
description = "Single Unified Intelligent MCP Server & 5-Gate Defensive Cyber Guardrails for AI Coding Agents"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [
    { name = "CookieGli Security Team" }
]
keywords = [
    "mcp",
    "model-context-protocol",
    "mcp-server",
    "security-guardrails",
    "cybersecurity",
    "blue-team",
    "sast",
    "taint-analysis",
    "claude-code",
    "cursor",
    "windsurf",
    "zero-trust",
    "binary-triage"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
    "Framework :: AsyncIO",
]

[project.urls]
Homepage = "https://github.com/LoveCookieee-java/CookieCyberTeam"
Documentation = "https://github.com/LoveCookieee-java/CookieCyberTeam#readme"
Repository = "https://github.com/LoveCookieee-java/CookieCyberTeam.git"
Issues = "https://github.com/LoveCookieee-java/CookieCyberTeam/issues"
Changelog = "https://github.com/LoveCookieee-java/CookieCyberTeam/releases"

[project.scripts]
cookie-cyber-team = "server:main"
cookie-cyber-mcp = "server:main"
cookie-cyber-cli = "core.cli:main"
cookiecyber = "core.cli:main"

[tool.setuptools]
py-modules = ["server"]

[tool.setuptools.packages.find]
where = ["."]
include = ["core*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
