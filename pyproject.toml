[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cookie-cyber-team"
version = "1.0.1"
description = "CookieCyberTeam MCP Security Guardrails & Multi-Agent Orchestration Server"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [
    { name = "CookieGli Security Team" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Security",
]

[project.scripts]
cookie-cyber-team = "server:main"
cookie-cyber-mcp = "server:main"
cookie-cyber-cli = "core.cli:main"
cookiecyber = "core.cli:main"

[tool.setuptools]
py-modules = ["server"]

[tool.setuptools.packages.find]
where = ["."]
include = ["core*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
